# Review the paid database plan before applying this Blueprint.
services:
  - type: web
    name: arthfind-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: arthfind-credentials
          property: connectionString
      - key: CREDENTIAL_ENCRYPTION_KEY
        generateValue: true

databases:
  - name: arthfind-credentials
    databaseName: arthfind
    user: arthfind
    plan: 0.1c-256mb
    diskSizeGB: 1
