name: Keep Render Backend Awake

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping Render backend
        run: |
          curl --fail --silent --show-error --location \
            --connect-timeout 10 \
            --max-time 90 \
            --retry 2 \
            --retry-delay 5 \
            --retry-all-errors \
            --output /dev/null \
            --write-out "HTTP %{http_code} | Response time: %{time_total}s\n" \
            https://arthfind-backend.onrender.com/health
